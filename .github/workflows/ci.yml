name: OpenBot fork CI

on:
  push:
    branches: ["openbot/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            platform: macos
          - name: Windows x64
            os: windows-2025
            platform: windows
    steps:
      - name: Check out fork commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install cmake ninja node pkgconf icu4c@78 miniupnpc openssl@3 opus

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      - name: Configure and build macOS
        if: matrix.platform == 'macos'
        run: |
          cmake -S . -B build-openbot-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_WERROR=ON \
            -DICU_ROOT="$(brew --prefix icu4c@78)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOpus_ROOT_DIR="$(brew --prefix opus)"
          cmake --build build-openbot-ci --parallel --target sunshine test_sunshine
          build-openbot-ci/tests/test_sunshine --gtest_filter='ConfigHttpTest.OpenBotDisplays*'

      - name: Configure and build Windows
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build-openbot-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_WERROR=ON
          cmake --build build-openbot-ci --parallel --target sunshine test_sunshine
          build-openbot-ci/tests/test_sunshine.exe --gtest_filter='ConfigHttpTest.OpenBotDisplays*'
